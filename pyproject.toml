[project]
name = "tts-playground"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.0",
  "httpx==0.28.1",
  "prometheus-client==0.25.0",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "soundfile==0.14.0",
  "structlog==26.1.0",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
build = [
  "hatchling==1.31.0",
  "editables==0.5",
]
qwen = [
  "llvmlite==0.48.0",
  "numba==0.66.0",
  "qwen-tts==0.1.1",
  "torch==2.11.0",
  "torchaudio==2.11.0",
]
supertonic = [
  "supertonic[serve]==1.3.1",
]
dev = [
  "mypy==2.2.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",
  "ruff==0.15.21",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# CUDA wheels only exist for Linux; macOS (Apple Silicon standby host) takes the PyPI
# build, which ships the MPS backend.
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tts_playground"]
